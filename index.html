<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip It!</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header><div><small>팬케이크 뒤집기</small><h1>Flip It!</h1></div>
<div class="actions"><button id="mute">🔊</button><button id="pause">일시정지</button></div></header>
<section class="stats">
<div>점수<strong id="score">0</strong></div><div>탄 횟수<strong id="burns">0 / 3</strong></div><div>남은 시간<strong id="time">30.0</strong></div>
<div>최고 점수<strong id="bestScore">0</strong></div><div>최고 생존<strong id="bestSurvival">0초</strong></div></section>
<section class="card"><div class="status"><span id="goal">🥞 타지 않게 뒤집어 주세요!</span><b id="msg">START를 눌러 시작하세요.</b></div>
<div id="area"><div class="pan"><div class="handle"></div><div id="pancake"></div></div>
<div class="bar"><i></i><b id="marker"></b></div></div>
<div class="controls"><button id="flip" class="primary" disabled>뒤집기</button><button id="start">START</button></div>
<p class="hint">마커가 초록 영역에 들어왔을 때 <b>뒤집기</b>를 누르세요. 방치하면 바가 끝에 닿아 탑니다. Space도 사용할 수 있습니다.</p></section>
<section class="info"><h2>30초 게임</h2><ol><li>START로 시작합니다.</li><li>초록 영역에서 뒤집으면 점수가 오릅니다.</li><li>바가 왼쪽·오른쪽 끝에 3번 닿으면(탄 상태) 실패합니다.</li><li>30초 동안 3번 미만으로 타면 성공입니다.</li></ol></section></main>
<div id="overlay" class="overlay hidden"><div class="modal"><h2 id="otitle"></h2><p id="otext"></p><button id="obtn" class="primary"></button></div></div>
<script src="script.js"></script></body></html>
